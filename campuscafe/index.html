<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CampusCafe</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><h1>CampusCafe</h1><p>Fresh bites between lectures</p></div>
    <div class="cart-pill" id="cartBadge">Cart: 0 items</div>
  </header>

  <main class="container">
    <section>
      <div class="controls">
        <div class="filter-group">
          <button class="filter-btn active" data-category="all">All</button>
          <button class="filter-btn" data-category="drinks">Drinks</button>
          <button class="filter-btn" data-category="snacks">Snacks</button>
        </div>
        <input class="search-input" id="search" type="search" placeholder="Search menu...">
      </div>
      <div class="menu-grid" id="menuGrid"></div>
    </section>

    <aside class="cart-panel">
      <h2>Your Cart</h2>
      <ul class="cart-list" id="cartList"></ul>
      <div class="summary-row summary-total"><span>Subtotal</span><span id="cartTotal">₹0</span></div>
      <p class="msg-error" id="cartMsg"></p>
      <a href="pages/checkout.html" class="btn btn-primary" id="checkoutBtn">Go to Checkout</a>
    </aside>
  </main>

  <script src="js/menuData.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
